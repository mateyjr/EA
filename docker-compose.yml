services:
  mongo:
    image: mongo:7
    container_name: colecle_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [colecle_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-}
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: colecle_backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-colecle_eams}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Colecle EAMS}
      WEBHOOK_CRON_SECRET: ${WEBHOOK_CRON_SECRET}
      APP_STORAGE_PREFIX: colecle-eams
      STORAGE_MODE: local
      LOCAL_STORAGE_DIR: /data/uploads
      RUN_CRONS: "true"
      EMERGENT_EMAIL_KEY: ${EMERGENT_EMAIL_KEY:-}
    volumes:
      - uploads_data:/data/uploads
    networks: [colecle_net]

  frontend:
    image: ${FRONTEND_IMAGE:-}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Frontend calls same origin (nginx proxies /api to backend), so leave empty.
        REACT_APP_BACKEND_URL: ""
    container_name: colecle_frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${FRONTEND_PORT:-3003}:80"
    networks: [colecle_net]

networks:
  colecle_net:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
